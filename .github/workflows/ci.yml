name: CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show files
        run: ls -la
      
      - name: remove old container
        run: docker rm -f github-actions-demo

      - name: Build Docker image
        run: docker build -t github-actions-demo3 .

      - name: Run Docker container
        run: docker run -d --name github-actions-demo3 -p 5000:5000 github-actions-demo3

      - name: Check container
        run: docker ps -a

      - name: Check container logs
        run: docker logs github-actions-demo3

      - name: Test application
        run: curl -v http://localhost:5000

      - name: Test SSH connection
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            whoami
            hostname
            docker --version
